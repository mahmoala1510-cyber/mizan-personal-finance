<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123b67" />
    <meta name="description" content="ميزان — منظّم مالي شخصي بسيط وآمن" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <title>ميزان</title>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" id="boot-screen">
        <img src="/icon.svg" alt="" width="58" height="58" />
        <strong>جارٍ تشغيل ميزان…</strong>
        <p id="boot-message">لحظات ونجهّز بياناتك.</p>
      </main>
    </div>
    <noscript><p class="no-script">يحتاج ميزان إلى تفعيل JavaScript في المتصفح.</p></noscript>
    <script>
      window.__mizanStarted = false;
      window.setTimeout(function () {
        if (window.__mizanStarted) return;
        var message = document.getElementById('boot-message');
        if (message) message.textContent = 'تعذّر تحميل التطبيق. حدّث الصفحة أو امسح بيانات الموقع من إعدادات المتصفح.';
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
